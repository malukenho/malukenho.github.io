<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jefersson Nathan</title>
  <meta name="description" content="Jefersson Nathan, in the Netherlands. A timeline of places.">
  <meta name="theme-color" content="#1d2f51">
  <meta property="og:title" content="Jefersson Nathan">
  <meta property="og:description" content="Jefersson Nathan, in the Netherlands. A timeline of places.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://malukenho.github.io/">
  <meta property="og:image" content="https://malukenho.github.io/assets/posters/alexa-night.png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/posters/alexa-night.png">
  <link rel="stylesheet" href="assets/css/site.css">
  <script type="module" src="assets/js/app.js"></script>
</head>
<body data-mode="home">
  <h1 class="sr-only">Jefersson Nathan</h1>
  <canvas class="stars" id="stars" aria-hidden="true"></canvas>

  <main class="view view-home is-active" id="view-home" data-view="home">
    <div class="stage-wrap">
      <button type="button" class="hero" id="hero">
        <img id="hero-still" src="assets/posters/alexa-night.png" alt="Alexa Centre" width="1024" height="1024" draggable="false">
      </button>
    </div>
    <div class="copy">
      <p class="bio" id="bio"></p>
      <section class="work" aria-labelledby="work-label">
        <h2 class="work-label" id="work-label"></h2>
        <ul class="work-list" id="work-list"></ul>
      </section>
    </div>
  </main>

  <footer class="foot" id="foot"></footer>

  <section class="view view-timeline" id="view-timeline" data-view="timeline" aria-label="Timeline" inert>
    <div class="strip" id="strip" tabindex="0"></div>
  </section>

  <section class="view view-map" id="view-map" data-view="map" aria-label="Maps" inert>
    <div id="map"></div>
    <p class="map-note" id="map-note" hidden></p>
    <div class="map-compass">
      <button class="compass-btn" id="compass" type="button" aria-label="Norte">
        <svg id="compass-rose" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M12 3.5 14.2 12 12 10.2 9.8 12Z" fill="currentColor"/>
        </svg>
      </button>
    </div>
    <div class="map-proj">
      <div class="pill" id="proj-pill">
        <button type="button" id="proj-mini" aria-pressed="true"></button>
        <button type="button" id="proj-globe" aria-pressed="false"></button>
      </div>
      <div class="minimap" id="minimap"></div>
    </div>
    <div class="range" id="range" role="tablist"></div>
  </section>

  <div class="scrubber" id="scrubber" role="slider" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" tabindex="0">
    <div class="playhead" id="playhead"></div>
  </div>
  <div class="ring" id="ring" hidden></div>

  <div class="dock dock-right">
    <div class="pill" id="clock-pill">
      <time id="clock-readout" class="clock-readout" datetime=""></time>
      <span class="split" aria-hidden="true"></span>
      <button type="button" id="lang-btn"></button>
    </div>
  </div>

  <noscript>
    <p class="noscript">This page needs JavaScript for the timeline.</p>
  </noscript>
</body>
</html>
