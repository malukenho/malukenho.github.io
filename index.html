<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Jefersson Nathan</title>
  <meta name="description" content="Jefersson Nathan, em Helmond. Uma linha do tempo de lugares.">
  <meta name="theme-color" content="#faf2e9">
  <meta property="og:title" content="Jefersson Nathan">
  <meta property="og:description" content="Jefersson Nathan, em Helmond. Uma linha do tempo de lugares.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://malukenho.github.io/">
  <meta property="og:image" content="https://malukenho.github.io/assets/posters/cozinha.png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="preload" as="image" href="assets/posters/cozinha.png">
  <link rel="stylesheet" href="assets/css/site.css">
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <script type="module" src="assets/js/app.js"></script>
</head>
<body data-mode="home">
  <h1 class="sr-only">Jefersson Nathan</h1>
  <canvas class="stars" id="stars" aria-hidden="true"></canvas>

  <main class="view view-home is-active" id="view-home" data-view="home">
    <div class="stage-wrap">
      <model-viewer
        id="viewer"
        src="assets/models/cozinha.glb"
        poster="assets/posters/cozinha.png"
        alt="Cozinha, uma cena de exemplo"
        camera-controls
        disable-zoom
        disable-pan
        interaction-prompt="none"
        touch-action="pan-y"
        interpolation-decay="20"
        camera-orbit="18deg 74deg 16.57m"
        camera-target="0.000m 0.759m 0.000m"
        field-of-view="12.5deg"
        min-camera-orbit="auto 72deg auto"
        max-camera-orbit="auto 76deg auto"
        shadow-intensity="0.75"
        shadow-softness="0.85"
        exposure="1.05"
        tone-mapping="aces"
        environment-image="neutral">
      </model-viewer>
    </div>
    <div class="copy">
      <p class="bio" id="bio"></p>
      <section class="work" aria-labelledby="work-label">
        <h2 class="work-label" id="work-label"></h2>
        <ul class="work-list" id="work-list"></ul>
      </section>
    </div>
    <footer class="foot" id="foot"></footer>
  </main>

  <section class="view view-timeline" id="view-timeline" data-view="timeline" aria-label="Linha do tempo" inert>
    <div class="strip" id="strip" tabindex="0"></div>
  </section>

  <section class="view view-map" id="view-map" data-view="map" aria-label="Mapa" inert>
    <div id="map"></div>
    <p class="map-note" id="map-note" hidden></p>
    <div class="map-compass">
      <button class="compass-btn" id="compass" type="button" aria-label="Norte">
        <svg id="compass-rose" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.4"/>
          <path d="M12 3.5 14.2 12 12 10.2 9.8 12Z" fill="currentColor"/>
        </svg>
      </button>
    </div>
    <div class="map-proj">
      <div class="pill" id="proj-pill">
        <button type="button" id="proj-mini" aria-pressed="true"></button>
        <button type="button" id="proj-globe" aria-pressed="false"></button>
      </div>
      <div class="minimap" id="minimap"></div>
    </div>
    <div class="range" id="range" role="tablist"></div>
  </section>

  <div class="scrubber" id="scrubber" role="slider" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" tabindex="0">
    <div class="playhead" id="playhead"></div>
  </div>
  <div class="ring" id="ring" hidden></div>

  <div class="dock dock-left">
    <div class="pill" id="mode-pill">
      <button type="button" data-mode="timeline" id="open-timeline"></button>
      <button type="button" data-mode="map" id="open-map"></button>
    </div>
    <div class="pill" id="filter-pill">
      <button type="button" id="filter-btn" aria-expanded="false"></button>
      <span class="split" aria-hidden="true"></span>
      <button type="button" class="icon-btn" id="search-btn" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
          <path d="M15 15.2 19 19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
      <input id="search" type="search" autocomplete="off" enterkeyhint="search">
      <div class="popover" id="filter-menu" hidden></div>
    </div>
  </div>

  <div class="dock dock-right">
    <div class="pill">
      <button type="button" class="icon-btn" id="sound-btn" aria-pressed="false" aria-expanded="false">
        <svg id="sound-icon" viewBox="0 0 24 24" aria-hidden="true"></svg>
      </button>
      <div class="popover" id="sound-menu" hidden></div>
    </div>
    <div class="pill" id="clock-pill">
      <button type="button" id="clock-btn" aria-expanded="false"></button>
      <span class="split" aria-hidden="true"></span>
      <button type="button" id="lang-btn"></button>
      <div class="popover" id="time-menu" hidden>
        <div class="time-head">
          <span id="time-readout"></span>
          <button type="button" id="time-now"></button>
        </div>
        <input id="time-range" type="range" min="0" max="1440" step="5" value="720">
      </div>
    </div>
  </div>

  <noscript>
    <p class="noscript">Esta página precisa de JavaScript para a linha do tempo em 3D.</p>
  </noscript>
</body>
</html>
